<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هناكل ايه النهارده؟</title>
  <style>

.boss-img {
  width: 180px;
  height: 200px; 
  object-fit: cover;
  border-radius: 12px;
  border: 5px solid #26de81;
  margin-bottom: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: bossFloat 2.5s ease-in-out infinite;
}

@keyframes bossFloat {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-8px) scale(1.05); }
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff9f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      overflow-x: hidden;
    }

    /* ========== Floating background emojis ========== */
    .emoji-bg {
      position: fixed;
      font-size: 22px;
      opacity: 0.1;
      pointer-events: none;
      animation: floatEmoji linear infinite;
      z-index: 0;
    }

    @keyframes floatEmoji {
      0%   { transform: translateY(0)    rotate(0deg);  opacity: 0.10; }
      50%  {                                             opacity: 0.18; }
      100% { transform: translateY(-30px) rotate(20deg); opacity: 0.10; }
    }

    /* ========== Main page ========== */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    /* ========== Title ========== */
    .title-box {
      margin-bottom: 0.6rem;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1)   rotate(0deg);  }
    }

    .crown {
      font-size: 48px;
      display: block;
      animation: rock 1.8s ease-in-out infinite;
    }

    @keyframes rock {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate( 8deg); }
    }

    .main-title {
      font-size: 30px;
      font-weight: 800;
      color: #222;
      margin-top: 4px;
    }

    /* ========== Taunt ticker ========== */
    .taunt-box {
      background: #f0f0f0;
      border: 1px solid #e0e0e0;
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 14px;
      color: #555;
      margin: 1.2rem 0 1.8rem;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      transition: opacity 0.3s;
    }

    /* ========== Buttons row ========== */
    .buttons-row {
      display: flex;
      flex-direction: row-reverse;
      gap: 1.2rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 28px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      min-width: 175px;
      letter-spacing: 0.3px;
      transition: transform 0.12s;
    }

    /* Cook button — roams freely via position:fixed */
    #cookBtn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
      position: fixed;
      z-index: 999;
      box-shadow: 0 5px 18px rgba(238, 90, 36, 0.4);
      transition: left 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  top  0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Invisible placeholder keeps layout stable */
    #cookPlaceholder {
      min-width: 175px;
      padding: 15px 28px;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      border: none;
      background: transparent;
    }

    /* Order button — the hero */
    #orderBtn {
      background: linear-gradient(135deg, #26de81, #20bf6b);
      color: #fff;
      box-shadow: 0 5px 18px rgba(32, 191, 107, 0.4);
      animation: heroPulse 2s ease-in-out infinite;
    }

    @keyframes heroPulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 5px 18px rgba(32, 191, 107, 0.40); }
      50%       { transform: scale(1.05); box-shadow: 0 8px 26px rgba(32, 191, 107, 0.60); }
    }

    #orderBtn:hover  { animation: none; transform: scale(1.10); }
    #orderBtn:active {                  transform: scale(0.94); }

    /* ========== Escape counter ========== */
    .escape-counter {
      margin-top: 1.4rem;
      font-size: 13px;
      color: #888;
    }

    .escape-counter span {
      font-weight: 700;
      color: #ee5a24;
    }

    /* ========== Modal ========== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      border: 1px solid #eee;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .modal-emo {
      font-size: 60px;
      display: block;
      margin-bottom: 0.8rem;
      animation: rock 1s ease-in-out infinite;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      color: #222;
      margin-bottom: 0.4rem;
    }

    .modal-sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 1.4rem;
      line-height: 1.7;
    }

    .modal-close {
      background: linear-gradient(135deg, #26de81, #20bf6b);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 11px 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s;
    }

    .modal-close:hover  { transform: scale(1.06); }
    .modal-close:active { transform: scale(0.96); }

    /* ========== Responsive ========== */
    @media (max-width: 480px) {
      .main-title  { font-size: 24px; }
      .btn         { min-width: 145px; font-size: 14px; padding: 13px 20px; }
      .buttons-row { gap: 0.8rem; }
      .taunt-box   { min-width: 240px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- Floating background food emojis -->
  <span class="emoji-bg" style="top:6%;  left:8%;  animation-duration:5s;">🍕</span>
  <span class="emoji-bg" style="top:12%; right:7%; animation-duration:7s; animation-delay:1s;">🍔</span>
  <span class="emoji-bg" style="bottom:10%; left:5%;  animation-duration:6s; animation-delay:2s;">🥗</span>
  <span class="emoji-bg" style="bottom:14%; right:10%;animation-duration:8s; animation-delay:0.5s;">🍜</span>
  <span class="emoji-bg" style="top:44%; left:2%;  animation-duration:5.5s;animation-delay:1.5s;">🍣</span>
  <span class="emoji-bg" style="top:55%; right:3%; animation-duration:6.5s;animation-delay:2.5s;">🍩</span>
  <span class="emoji-bg" style="top:30%; left:50%; animation-duration:9s;  animation-delay:3s;">🥙</span>

  <!-- Main content -->
  <div class="page" id="page">

    <!-- Title -->
<div class="title-box">
  <img src="me.jpeg" class="boss-img">
  <span class="crown">👑</span>
  <h1 class="main-title">هتاكليني ايه لما اجي؟</h1>
</div>

    <!-- Taunt ticker -->
    <div class="taunt-box" id="tauntBox">🤔 فكّر كويس قبل ما تحاول...</div>

    <!-- Buttons -->
    <div class="buttons-row">
      <!-- Invisible placeholder keeps layout stable while cook btn roams -->
      <div id="cookPlaceholder" class="btn" aria-hidden="true">👩‍🍳 هتطبخيلي</div>
      <button class="btn" id="orderBtn" onclick="orderFood()">🛵 نطلب من بره</button>
    </div>

    <!-- Escape counter -->
    <p class="escape-counter">محاولات الطبخ الفاشلة: <span id="counter">0</span> 😂</p>

  </div>

  <!-- The runaway cook button (fixed-positioned) -->
  <button class="btn" id="cookBtn">👩‍🍳 هتطبخيلي</button>

  <!-- Success modal -->
  <div class="overlay" id="modal">
    <div class="modal">
      <span class="modal-emo">🎊</span>
      <h2 class="modal-title">خيار موفق! 😂</h2>
      <p class="modal-sub">
        قرار تاريخي خالص 🏆<br>
       الحمد لله بجد 😌
      </p>
      <button class="modal-close" onclick="closeModal()">قال تطبخي قال </button>
    </div>
  </div>

  <script>
    const cookBtn    = document.getElementById('cookBtn');
    const counterEl  = document.getElementById('counter');
    const tauntBox   = document.getElementById('tauntBox');

    let escapeCount = 0;
    let lastMove    = 0;
    
    
    /* ── Taunt messages ─────────────────────────────────────── */
    const taunts = [
      "🏃 الطبخ شاف الفتوى وراح...",
      "😅 إيه ده؟ الزرار فضّل ماشي!",
      "🤷 الطبخ مش في جدولنا دلوقتي",
      "😂 حاول تاني، مش هينفع",
      "👻 الزرار ده مسكون!",
      "🤡 فاكر إنك هتعمل إيه بالظبط؟",
      "😤 أنا مش بطبخ وخلاص!",
      "🙈 ده مش خيار متاح يا صاحبي",
      "🧠 مخك بيقولك اطلب، سمعه!",
      "🏆 بطل الهروب من المطبخ!",
      "💨 سرعة الزرار ده تتحدى F1",
      "😭 ليه بتتعذب كده؟",
    ];

    let tauntIndex = 0;

    function rotateTaunt(custom) {
      tauntBox.style.opacity = '0';
      setTimeout(() => {
        tauntBox.textContent = custom || taunts[tauntIndex % taunts.length];
        tauntIndex++;
        tauntBox.style.opacity = '1';
      }, 280);
    }

    

    // Auto-rotate taunts while nobody is trying
    setInterval(() => { if (escapeCount === 0) rotateTaunt(); }, 3000);

    /* ── Place cook button over its placeholder ─────────────── */
    function placeInitially() {
      const ph   = document.getElementById('cookPlaceholder');
      const rect = ph.getBoundingClientRect();
      cookBtn.style.left  = rect.left + 'px';
      cookBtn.style.top   = rect.top  + 'px';
      cookBtn.style.width = rect.width + 'px';
    }

    /* ── Escape logic ───────────────────────────────────────── */
    function escape(mx, my) {
      const now = Date.now();
      if (now - lastMove < 70) return;   // throttle
      lastMove = now;

      const r  = cookBtn.getBoundingClientRect();
      const cx = r.left + r.width  / 2;
      const cy = r.top  + r.height / 2;
      const dx = cx - mx, dy = cy - my;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 230) return;   // cursor too far away

      escapeCount++;
      counterEl.textContent = escapeCount;

      // Special taunts at milestones
      const milestones = [1, 3, 6, 10, 15, 20, 30];
      const milestone_msgs = [
        "😂 محاولة واحدة وخلاص؟",
        "😅 تلات مرات يا بطل!",
        "🏃 ست مرات والزرار مش تعبان!",
        "🏆 عشر محاولات!! أنت بطل هروب!",
        "🤡 خمستاشر؟ إنت مش هتوقف؟",
        "😭 عشرين!! الزرار بيضحك عليك!",
        "👑 تلاتين محاولة... إنت أسطورة!",
      ];
      const mi = milestones.indexOf(escapeCount);
      if (mi !== -1) rotateTaunt(milestone_msgs[mi]);

      // Move button away from cursor with jitter
      let angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.3;
      const speed  = Math.max(150, 300 - dist * 0.5);
      const margin = 16;
      const vw = window.innerWidth,  vh = window.innerHeight;
      const bw = cookBtn.offsetWidth, bh = cookBtn.offsetHeight;

      let nx = cx + Math.cos(angle) * speed - bw / 2;
      let ny = cy + Math.sin(angle) * speed - bh / 2;

      // Keep inside viewport
      nx = Math.max(margin, Math.min(vw - bw - margin, nx));
      ny = Math.max(margin, Math.min(vh - bh - margin, ny));

      cookBtn.style.left = nx + 'px';
      cookBtn.style.top  = ny + 'px';
    }

    /* ── Event listeners ────────────────────────────────────── */
    document.addEventListener('mousemove', e => escape(e.clientX, e.clientY));

    document.addEventListener('touchmove', e => {
      escape(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // On the off-chance someone manages to click it
    cookBtn.addEventListener('click', e => {
      rotateTaunt("😂 لا ده مش ممكن، جرّب تاني!");
      escape(e.clientX - 80, e.clientY - 80);
    });

    /* ── Modal ──────────────────────────────────────────────── */
    function orderFood() {
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      rotateTaunt("✅ قرار صح! الأكل جاي 🛵💨");
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    /* ── Init ───────────────────────────────────────────────── */
    window.addEventListener('load',   () => setTimeout(placeInitially, 120));
    window.addEventListener('resize', placeInitially);
  </script>

</body>
</html>
